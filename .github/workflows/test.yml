name: Tests

on:
  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Neovim tests (${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim:
          - v0.12.5
          - nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Neovim ${{ matrix.neovim }}
        env:
          NVIM_TAG: ${{ matrix.neovim }}
        run: |
          archive="$RUNNER_TEMP/nvim-$NVIM_TAG.tar.gz"
          install_dir="$RUNNER_TEMP/nvim-$NVIM_TAG"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/neovim/neovim/releases/download/$NVIM_TAG/nvim-linux-x86_64.tar.gz"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Install Plenary
        run: |
          plenary_dir="$GITHUB_WORKSPACE/.test-config/nvim/pack/tests/start/plenary.nvim"
          mkdir -p "$(dirname "$plenary_dir")"
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim "$plenary_dir"

      - name: Run Plenary tests
        run: |
          nvim --version
          nvim --headless -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/codecopy { minimal_init = 'tests/minimal_init.lua' }"
